<div class="Contenedor-Datos_Personales">
    <div class="Title">
        <h1>Datos Personales</h1>
        <p>Completa los campos</p>
    </div>

    <form class="Formulario-Datos" [formGroup]="Formnulario" action="">
        <div class="Grupo-Datos-Personales">
            <div class="{{CampoSelecionado == 'Usuario' ? 'activo' : 'label-input'}}">
                <label for="Usuario">Usuario</label>
                <input (click)="CambiarCampo('Usuario')" [formControl]="Formnulario.controls.Usuario" type="text" class="input-datos-personales">
            </div>
            <div class="{{CampoSelecionado == 'Contraseña' ? 'activo' : 'label-input'}}">
                <label for="">Contraseña</label>
                <input (click)="CambiarCampo('Contraseña')" [formControl]="Formnulario.controls.Contrasena" type="text" class="input-datos-personales">
            </div>
             
        </div>
        <div class="Grupo-Datos-Personales">
            <div class="{{CampoSelecionado == 'Correo' ? 'activo' : 'label-input'}}">
                <label for="">Correo</label>
                <input (click)="CambiarCampo('Correo')" [formControl]="Formnulario.controls.Correo" type="text" class="input-datos-personales">
            </div> 
            <div class="{{CampoSelecionado == 'RepetirContraseña' ? 'activo' : 'label-input'}}">
                <label for="">Repetir Contraseña</label>
                <input (click)="CambiarCampo('RepetirContraseña')" [formControl]="Formnulario.controls.RepetirContrasena" type="" class="input-datos-personales">
            </div>
        </div>

    </form>
    <h4 class="Requerido">Campo requerido</h4>
</div>
