<div class="Contenedor-Nivel-Experiencia">
    <div class="Title Title-No-Active">
        <h1>ROL O NIVEL DE EXPERIENCIA</h1>
        <p>Elije tus roles.</p>
    </div>

     <div class="Contenedor-items-Roles">
        <div [class]="ListaRoles.includes('Estudiante') ? 'select' : 'item-rol'" (click)="SeleccionarRol('Estudiante')">
            <h4>Estudiante</h4>
        </div>
        <div [class]="ListaRoles.includes('Diseñador') ? 'select' : 'item-rol'" (click)="SeleccionarRol('Diseñador')">
            <h4>Diseñador</h4>
        </div>
        <div [class]="ListaRoles.includes('Full-stack') ? 'select' : 'item-rol'" (click)="SeleccionarRol('Full-stack')">
            <h4>Full-stack</h4>
        </div>
        <div [class]="ListaRoles.includes('Front-end') ? 'select' : 'item-rol'" (click)="SeleccionarRol('Front-end')">
            <h4>Front-end</h4>
        </div>
        <div [class]="ListaRoles.includes('Back-end') ? 'select' : 'item-rol'" (click)="SeleccionarRol('Back-end')">
            <h4>Back-end</h4>
        </div>
        
    </div>
    <h4 class="Requerido">Campo requerido</h4>
</div>
