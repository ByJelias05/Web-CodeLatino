<div class="Contenedor-Informacion-Adicional">
    <div class="Title Title-No-Active">
        <h1>INFORMACION ADICIONAL</h1>
        <p>Proporciona información adicional sobre ti.</p>
    </div>
        <div class="Avatar-Region-Link">
            <div class="avatar">
                <h3>Avatar</h3>
                <div class="Avatar-Image">
                    <img src="https://avatars.githubusercontent.com/u/102885626?v=4" alt="Avatar" />
                </div>
                <input [hidden]=true type="file" accept="image/*" />
            </div>
            <div class="Region-Link">
                <div class="Region">
                    <h3>Region</h3>
                    <input type="text" placeholder="Republica Dominicana" />
                </div>
                <div class="Link">
                    <h3>Link</h3>
                    <input type="text" placeholder="https://github.com/ByJelias05"/>
                </div>
        </div>
    </div>
</div>
